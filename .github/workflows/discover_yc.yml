name: Discover YC careers pages
on:
  schedule:
    - cron: "41 6 * * 1"      # weekly, Monday
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scraper/discover_yc.py
      - run: |
          git config user.name "job-radar-bot"; git config user.email "job-radar-bot@users.noreply.github.com"
          git add scraper/yc_boards.json
          git diff --cached --quiet || git commit -m "Update YC careers pages"
          git pull --rebase -X theirs origin main || true
          git push
