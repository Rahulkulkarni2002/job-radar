name: Discover UAE careers pages
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scraper/discover_uae.py
      - run: |
          git config user.name "job-radar-bot"; git config user.email "job-radar-bot@users.noreply.github.com"
          git add scraper/uae_boards.json
          git diff --cached --quiet || git commit -m "Update UAE careers pages"
          git pull --rebase -X theirs origin main || true
          git push
